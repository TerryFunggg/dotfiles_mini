general {
        output_format = "i3bar"
        colors = true
        interval = 5
}

# Order of appearance in the status bar - simplified modules
order += "volume master"
order += "cpu_usage"
order += "cpu_temperature 3"
order += "memory"
order += "disk /"
order += "tztime local"

# Volume control with PulseAudio
volume master {
        device = "pulse"
        format = "󰕾 %volume"
        format_muted = "󰖁 MUTED"
        min_width = 60
        align = "center"
}

# CPU usage percentage
cpu_usage {
        format = "󰻠 %usage"
        min_width = 60
        align = "center"
}

# CPU temperature (using x86_pkg_temp which is thermal zone 3)
cpu_temperature 3 {
        format = "󰔏 %degrees °C"
        path = "/sys/class/thermal/thermal_zone3/temp"
        min_width = 60
        align = "center"
}

# Memory usage percentage
memory {
        format = "󰍛 %percentage_used"
        min_width = 60
        align = "center"
}

# Disk usage for root partition
disk "/" {
        format = "󰉋 %free"
        min_width = 100
        align = "center"
}

# Date and time
tztime local {
        format = "󰃭 %Y-%m-%d 󰥔 %H:%M"
}
