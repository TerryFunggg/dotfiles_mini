# Catppuccin Mocha for Starship
# Palette: https://github.com/catppuccin/catppuccin

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$golang\
$nodejs\
$rust\
$c\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol   = "[❯](bold #f38ba8)"
vimcmd_symbol  = "[❮](bold #f9e2af)"

[directory]
style = "bold #89b4fa"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "bold #cba6f7"

[git_status]
style = "bold #f38ba8"

[python]
style = "bold #f9e2af"
format = "[$symbol$version]($style) "

[golang]
style = "bold #89dceb"
format = "[$symbol$version]($style) "

[nodejs]
style = "bold #a6e3a1"
format = "[$symbol$version]($style) "

[rust]
style = "bold #fab387"
format = "[$symbol$version]($style) "

[c]
style = "bold #94e2d5"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 500
format = "took [$duration](bold #f9e2af)"
style = "bold #f9e2af"
